<div id="bar"><div class="in"><div class="chips" id="chips"></div><div class="row"><input id="msg" placeholder="e.g. Shahgee 2 OG glass 500" autocomplete="off"><button class="p" id="go">Add</button></div></div></div>

<script>

const fmt=n=>"Rs "+Math.round(n).toLocaleString("en-IN");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const Q=[
["The honest, trustworthy merchant will be with the prophets, the truthful and the martyrs.","Tirmidhi","Honesty"],

["The Prophet ﷺ found wet grain under a dry heap and told the seller to show it, saying whoever deceives is not of us.","Muslim","Honesty"],

["Give full measure when you measure, and weigh with a straight balance. That is better and fairer in the end.","Quran 17:35","Justice"],

["Allah has made trade lawful and interest unlawful.","Quran 2:275","Justice"],
["No one hoards except a sinner.","Muslim","Justice"],
["Allah’s mercy is on the one who is gentle when he sells, when he buys, and when he asks for payment.","Bukhari","Mercy"],

["Allah is gentle and loves gentleness in all matters.","Bukhari and Muslim","Mercy"],

["No soul dies before its provision is complete. So be moderate in seeking it: take what is halal and leave what is haram.","Ibn Majah","Rizq"],
["If you are grateful, I will surely give you more.","Quran 14:7","Rizq"],
["Real wealth is not having many possessions. Real wealth is a heart that feels enough.","Bukhari and Muslim","Rizq"],
["Allah is pure and accepts only what is pure.","Muslim","Rizq"],
["How wonderful is the believer’s situation: in good times he is thankful, in hard times he is patient, and both are good for him.","Muslim","Rizq"],
["Charity never makes wealth less.","Muslim","Giving"],
["Allah says: spend, son of Adam, and I will spend on you.","Bukhari and Muslim","Giving"],
["Those who spend for Allah are like a grain that grows seven ears, each with a hundred grains.","Quran 2:261","Giving"],
["In their wealth there was a rightful share for the one who asks and the one in need.","Quran 51:19","Giving"],
["O believers, spend from the good things you have earned.","Quran 2:267","Giving"],
["The giving hand is better than the taking hand.","Bukhari and Muslim","Giving"],

["Allah loves that when one of you does a job, he does it with excellence.","Bayhaqi","Work"],

["O Allah, let what You made lawful be enough for me instead of what You forbade, and make me need no one but You.","Tirmidhi","Dua","اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ"],
["O Allah, I ask You for useful knowledge, good provision and accepted deeds.","Ibn Majah","Dua","اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا وَعَمَلًا مُتَقَبَّلًا"],
["O Allah, bless my community in its early mornings.","Tirmidhi","Dua"],
["Our Lord, give us good in this world and good in the next.","Quran 2:201","Dua"],
["My Lord, help me be grateful for the blessings You gave me.","Quran 27:19","Dua"]
];
let tab="chat",pend=null,openC=null;
const sameC=(a,b)=>a.toLowerCase()===b.toLowerCase();
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
const names=()=>[...new Set([...db.sales.map(s=>s.c),...db.pays.map(s=>s.c)].filter(Boolean))];
function match(n){n=n[0].toUpperCase()+n.slice(1).toLowerCase();const f=names().find(x=>sameC(x,n)||(n.length>3&&lev(x.toLowerCase(),n.toLowerCase())<=1));return f||n}
const unitCost=s=>s.cost!=null?s.cost:db.costs[s.p.toLowerCase()];
const profit=s=>{const u=unitCost(s);return s.a-(u!=null?u*s.q:s.a*db.margin/100)};
const bal=c=>db.sales.filter(s=>s.st==="u"&&sameC(s.c,c)).reduce((a,s)=>a+s.a,0)-db.pays.filter(p=>sameC(p.c,c)).reduce((a,p)=>a+p.a,0);
function parse(raw){
 let t=raw.trim().replace(/,/g,"");if(!t)return null;
 const tok=t.split(/\s+/);let cust="";
 if(!/^\d/.test(tok[0])&&!/^(cash|sold|sale|sell|paid)$/i.test(tok[0]))cust=match(tok.shift());
 let rest=tok.join(" "),cost=null;
 rest=rest.replace(/\b(?:cost|cp|kharid)\s*(\d+(?:\.\d+)?)/i,(m,a)=>{cost=+a;return " "});
 const payW=/\b(paid|pay|received|recieved|mila|mile|diye|diya|jama|cash)\b/i.test(rest);
 const tot=/\b(total|kul)\b/i.test(rest);
 rest=rest.replace(/\b(total|kul|each|per|har|x|paid|pay|received|recieved|mila|mile|diye|diya|jama|cash|pcs|pc|pieces?|sold|sale|sell|rs|rupees|udhaar)\b|@/ig," ");
 const nums=(rest.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
 const prod=rest.replace(/\d+(?:\.\d+)?/g," ").replace(/\s+/g," ").trim();
 if(!nums.length)return{err:"Add a price, e.g. Shahgee 2 OG glass 500"};
 if(cust&&payW&&!prod)return{type:"pay",c:cust,a:nums[nums.length-1]};
 const q=nums.length>1?nums[0]:1,n=nums[nums.length-1];
 return{type:"sale",c:cust,p:prod||"Item",q,n,each:!tot&&nums.length>1,cost,st:(!cust||payW)?"p":"u"};
}
const pendTotal=p=>p.each?p.q*p.n:p.n;
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function copy(t,ok){const done=()=>toast(ok||"Copied");try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}function fb(){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();done()}}
function addMsg(){const v=$("#msg").value;if(/^\s*stock\b/i.test(v))return addStock(v);const r=parse(v);if(!r)return;if(r.err){toast(r.err);return}
 if(r.type==="pay"){db.pays.push({id:Date.now(),t:Date.now(),c:r.c,a:r.a});save();$("#msg").value="";pend=null;toast("Payment saved");return render()}
 pend=r;$("#msg").value="";render()}
function savePend(){const p=pend,a=pendTotal(p);db.sales.push({id:Date.now(),t:Date.now(),c:p.c,p:p.p,q:p.q,a,cost:p.cost,st:p.st});const sk=db.stock[p.p.toLowerCase()];if(sk)sk.q=Math.max(0,sk.q-p.q);if(p.cost!=null)db.costs[p.p.toLowerCase()]=p.cost;pend=null;save();toast("Saved. Alhamdulillah");render()}
function del(id){const sx=db.sales.find(x=>x.id===id),kx=sx&&db.stock[sx.p.toLowerCase()];if(kx)kx.q+=sx.q;db.sales=db.sales.filter(s=>s.id!==id);db.pays=db.pays.filter(s=>s.id!==id);save();render()}
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return+d};
function entryHTML(e){const d=new Date(e.t).toLocaleDateString([],{day:"numeric",month:"short"}),pay=e.p===undefined,nm=pay?e.c:(e.c||"Cash sale"),sub=pay?"Payment received":e.q+" × "+e.p,amt=pay?"+"+fmt(e.a):fmt(e.a),st=pay?"Received":e.st==="u"?"Udhaar":"Paid",cl=pay?"pos":e.st==="u"?"neg":"";
 return`<div class="it"><div class="av ${pay?"g":e.st==="u"?"r":""}">${esc(nm[0].toUpperCase())}</div><div class="gr"><b>${esc(nm)}</b><div class="mute">${esc(sub)}, ${d}</div></div><div class="rt"><b class="${cl}">${amt}</b><div class="mute">${st}</div></div><button class="x" onclick="del(${e.id})">✕</button></div>`}
function vChat(){const t=today(),ts=db.sales.filter(s=>s.t>=t),sale=ts.reduce((a,s)=>a+s.a,0),pf=ts.reduce((a,s)=>a+profit(s),0),rc=db.pays.filter(p=>p.t>=t).reduce((a,p)=>a+p.a,0),n=new Date(),ms=+new Date(n.getFullYear(),n.getMonth(),1),mp=db.sales.filter(s=>s.t>=ms).reduce((a,s)=>a+profit(s),0),out=names().reduce((a,c)=>a+Math.max(0,bal(c)),0);
 const q=Q[Math.floor(Date.now()/864e5)%Q.length],old=db.sales.length&&Date.now()-db.lastBackup>3*864e5,low=Object.entries(db.stock).filter(x=>x[1].q<=3),all=[...db.sales,...db.pays].sort((a,b)=>b.t-a.t).slice(0,10);
 let h=`<header class="top"><div class="av">H</div><div class="gr"><b>Assalamu alaikum</b><div class="mute">${hijri()}${n.getDay()===5?", Jumu’ah Mubarak":""}</div></div><button class="ib" onclick="go('backup')">${ic("save")}</button></header>
 <div class="bal"><div class="mute">Profit this month</div><div class="big">${fmt(mp)}</div><span class="pill ${pf<0?"neg":""}">${pf<0?"":"+"}${fmt(pf)} today</span></div>
 <div class="acts"><button class="act" onclick="mic()"><i>${ic("mic")}</i>Voice</button><button class="act" onclick="go('stock')"><i>${ic("box")}</i>Stock</button><button class="act" onclick="go('search')"><i>${ic("search")}</i>Find</button><button class="act" onclick="closeDay()"><i>${ic("moon")}</i>Close day</button></div>
 <div class="card"><div class="row sp"><span class="mute">Sales today</span><b>${fmt(sale)}</b></div><div class="row sp" style="margin-top:6px"><span class="mute">Received today</span><b class="pos">${fmt(rc)}</b></div><div class="row sp" style="margin-top:6px"><span class="mute">Udhaar pending</span><b class="neg">${fmt(out)}</b></div></div>`;
 if(low.length)h+=`<div class="card" onclick="go('stock')"><b>Low stock</b><div class="mute">${low.map(x=>esc(x[0])+" ("+x[1].q+")").join(", ")}</div></div>`;
 if(old)h+=`<div class="card row sp"><span>Back up your hisab today.</span><button onclick="go('backup')">Open</button></div>`;
 if(pend){const p=pend,a=pendTotal(p),k=p.p.toLowerCase(),u=p.cost!=null?p.cost:db.costs[k],pf2=a-(u!=null?u*p.q:a*db.margin/100),pr=db.sales.filter(s=>s.p.toLowerCase()===k),sk=db.stock[k];
  h+=`<div class="card moon"><b>Check before saving</b><p>${esc(p.c||"Cash sale")}, ${p.q} × ${esc(p.p)} = <b>${fmt(a)}</b><br>Profit about ${fmt(pf2)}${u==null?" (estimated at "+db.margin+"%)":""}</p>${pr.length?`<div class="mute">Last price ${fmt(pr[pr.length-1].a/pr[pr.length-1].q)}, average ${fmt(pr.reduce((x,s)=>x+s.a/s.q,0)/pr.length)} each</div>`:""}${u!=null&&a/p.q<u?`<div class="neg">Below your cost of ${fmt(u)} each</div>`:""}${sk&&sk.q<p.q?`<div class="neg">Only ${sk.q} in stock</div>`:""}
  <div class="row" style="flex-wrap:wrap;margin-top:8px"><button onclick="pend.each=!pend.each;render()">${p.each?"Price is each":"Price is total"}</button>${p.c?`<button onclick="pend.st=pend.st==='u'?'p':'u';render()">${p.st==="u"?"Udhaar":"Paid"}</button>`:""}<button class="p" onclick="savePend()">Save</button><button onclick="pend=null;render()">Cancel</button></div></div>`}
 h+=`<div class="card moon"><div class="ar">بِسْمِ ٱللَّٰهِ</div><p class="q">“${q[0]}”</p><div class="mute"><b>${q[1]}</b>, paraphrased</div><button style="margin-top:8px" onclick="go('hikmah')">More hikmah</button></div><h2>Recent</h2>`+(all.length?all.map(entryHTML).join(""):`<div class="card mute">Nothing yet. Try “Shahgee 2 OG glass 500”. Add “paid” or “cash” if money was received. “Shahgee paid 300” records a payment. “stock OG glass 50 cost 300” adds stock.</div>`);
 return h}
function vLedger(){const cs=names().map(c=>[c,bal(c)]).filter(x=>x[1]!==0).sort((a,b)=>b[1]-a[1]),tot=cs.reduce((a,x)=>a+x[1],0);
 let h=`<h1>Udhaar ledger</h1><div class="card moon"><span class="mute">Total pending</span><div class="big">${fmt(tot)}</div></div>`;
 if(!cs.length)h+=`<div class="card mute">No pending udhaar.</div>`;
 cs.forEach(([c,b])=>{h+=`<div class="card"><div class="row sp" onclick="openC=openC==='${esc(c)}'?null:'${esc(c)}';render()"><b>${esc(c)}</b><b class="${b>0?"neg":"pos"}">${fmt(b)}</b></div>`;
  if(openC===c){const l=[...db.sales.filter(s=>sameC(s.c,c)&&s.st==="u"),...db.pays.filter(s=>sameC(s.c,c))].sort((a,b)=>b.t-a.t).slice(0,8);
   h+=l.map(entryHTML).join("")+`<div class="row"><input id="pa" type="number" inputmode="numeric" placeholder="Amount received"><button class="p" onclick="recv('${esc(c)}')">Save</button></div>
   <button style="margin-top:8px" onclick="copy('Assalamu alaikum ${esc(c)}, a gentle reminder that ${fmt(b)} is pending with us. Take your time, JazakAllah khair.','Reminder copied')">Copy gentle reminder</button>`}
  h+=`</div>`});return h}
function recv(c){const a=+$("#pa").value;if(!a)return toast("Enter an amount");db.pays.push({id:Date.now(),t:Date.now(),c,a});save();toast("Payment saved");render()}
function vSearch(){return`<h1>Find a past sale</h1><div class="mute">Search a product or customer from all your old hisab.</div><input id="sq" placeholder="Type a product name" style="margin:10px 0" oninput="doSearch()"><div id="res"></div>`}
function doSearch(){const q=$("#sq").value.trim().toLowerCase(),r=$("#res");if(!q){r.innerHTML="";return}
 const m=db.sales.filter(s=>s.p.toLowerCase().includes(q)||s.c.toLowerCase().includes(q)).sort((a,b)=>b.t-a.t);
 if(!m.length){r.innerHTML=`<div class="card mute">No match. Check the spelling or try fewer letters.</div>`;return}
 const u=m.map(s=>s.a/s.q),avg=u.reduce((a,b)=>a+b,0)/u.length;
 r.innerHTML=`<div class="card moon"><b>${m.length} sales found</b><br>Last price: <b>${fmt(u[0])}</b> each · Average: <b>${fmt(avg)}</b> · Range: ${fmt(Math.min(...u))} to ${fmt(Math.max(...u))}</div>`+m.slice(0,30).map(entryHTML).join("")}
function vReports(){const n=new Date(),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),day=n.getDate(),ms=+new Date(n.getFullYear(),n.getMonth(),1);
 const ss=db.sales.filter(s=>s.t>=ms),pf=ss.reduce((a,s)=>a+profit(s),0),sl=ss.reduce((a,s)=>a+s.a,0),first=ss.length?Math.max(1,Math.floor((n-Math.min(...ss.map(s=>s.t)))/864e5)+1):day;
 const f=pf/Math.max(first,1)*dim,pr=f?Math.min(100,pf/f*100):0,days=Array(dim).fill(0);ss.forEach(s=>days[new Date(s.t).getDate()-1]+=profit(s));const mx=Math.max(1,...days);
 return`<h1>Reports</h1><div class="card moon"><svg viewBox="0 0 200 110" width="100%"><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round"/><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="var(--acc)" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="${pr} 100"/><text x="100" y="82" text-anchor="middle" fill="var(--ink)" font-size="22" font-weight="800">${fmt(pf)}</text><text x="100" y="100" text-anchor="middle" fill="var(--mute)" font-size="10">profit this month</text></svg>
 <div class="row sp"><span>Expected by month end</span><b class="pos">${fmt(f)}</b></div><div class="mute">Based on ${ss.length?first+" days of sales":"no sales yet"}. It’s a guess, not a promise.</div></div>
 <div class="stats"><div class="card"><span class="mute">Sales</span><b>${fmt(sl)}</b></div><div class="card"><span class="mute">Entries</span><b>${ss.length}</b></div><div class="card"><span class="mute">Margin used</span><b>${db.margin}%</b></div></div>
 <h2>Profit by day</h2><div class="card"><div class="bars">${days.map(v=>`<i style="height:${v/mx*100}%"></i>`).join("")}</div><div class="row sp mute"><span>1</span><span>${dim}</span></div></div>
 <h2>Top products this month</h2><div class="card">${topP(ss)}</div><h2>Unknown cost margin</h2><div class="card"><div class="mute">Used when a product has no cost. Add “cost 300” to a sale and I’ll remember it.</div><input type="number" inputmode="numeric" value="${db.margin}" onchange="db.margin=+this.value||20;save();render()" style="margin-top:8px"></div>
 <div class="card moon"><b>Sadaqah idea</b><div class="mute">1% of this month’s profit would be ${fmt(Math.max(0,pf)/100)}. Optional, your intention counts.</div></div>`}
function vBackup(){const d=db.lastBackup?Math.floor((Date.now()-db.lastBackup)/864e5)+" days ago":"never";
 return`<h1>Backup</h1><div class="card"><b>Last backup: ${d}</b><div class="mute">Your hisab lives on this phone. Copy a backup and keep it in WhatsApp saved messages or Notes.</div>
 <div class="row" style="flex-wrap:wrap;margin-top:10px"><button class="p" onclick="bk()">Copy backup</button>${navigator.share?`<button onclick="bk(1)">Share backup</button>`:""}<button onclick="csv()">Copy as CSV</button><button onclick="db.vl=db.vl==='ur-PK'?'en-IN':'ur-PK';save();render()">Voice: ${db.vl==='ur-PK'?'Urdu':'English'}</button><button onclick="dl()">Save as file</button>${ip?`<button onclick="ip.prompt()">Install app</button>`:""}</div></div>
 <h2>Restore</h2><div class="card"><textarea id="rs" placeholder="Paste your backup here"></textarea><button class="p" style="margin-top:8px" onclick="rst()">Restore from paste</button><input type="file" accept=".json" onchange="rfile(this)" style="margin-top:8px"><div class="mute">This replaces what is on this phone now.</div></div>`}
function bk(s){const t=JSON.stringify(db);db.lastBackup=Date.now();save();if(s&&navigator.share)navigator.share({text:t}).catch(()=>{});else copy(t,"Backup copied");render()}
function csv(){copy("Date,Customer,Product,Qty,Total,Status\n"+db.sales.map(s=>[new Date(s.t).toISOString().slice(0,10),s.c,s.p,s.q,s.a,s.st==="u"?"Udhaar":"Paid"].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n"),"CSV copied")}
function rst(){try{const o=JSON.parse($("#rs").value);if(!o.sales)throw 0;db=Object.assign({sales:[],pays:[],costs:{},stock:{},margin:20,lastBackup:0},o);save();toast("Restored");render()}catch(e){toast("That isn’t a valid backup")}}
const IC={home:"M3 11l9-8 9 8M5 9.5V20h14V9.5",book:"M4 7h16v12H4zM4 7l2-3h12l2 3M16 13h2",search:"M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-4.5-4.5",chart:"M4 20V10M10 20V4M16 20v-8M21 20H3",moon:"M20 14.5A8 8 0 119.5 4a6.5 6.5 0 0010.5 10.5z",mic:"M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3zM5 11a7 7 0 0014 0M12 18v3",box:"M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10",save:"M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"};
const ic=n=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[n]}"/></svg>`;
function addStock(v){let c=null;v=v.replace(/\b(?:cost|cp)\s*(\d+(?:\.\d+)?)/i,(m,a)=>{c=+a;return " "}).replace(/stock/i," ");const n=(v.match(/\d+(?:\.\d+)?/g)||[]).map(Number),p=v.replace(/\d+(?:\.\d+)?/g," ").replace(/\s+/g," ").trim().toLowerCase();if(!p||!n.length){toast("Try: stock OG glass 50 cost 300");return}const o=db.stock[p]||{q:0};o.q+=n[0];if(c!=null){o.cost=c;db.costs[p]=c}db.stock[p]=o;save();$("#msg").value="";toast("Stock updated");render()}
function vStock(){const l=Object.entries(db.stock).sort((a,b)=>a[1].q-b[1].q),val=l.reduce((a,x)=>a+x[1].q*(x[1].cost||0),0),low=l.filter(x=>x[1].q<=3);
 return`<h1>Stock</h1><div class="card moon"><span class="mute">Stock value at cost</span><div class="big">${fmt(val)}</div></div>`+(l.length?l.map(([p,o])=>`<div class="it"><div class="av ${o.q<=3?"r":""}">${esc(p[0].toUpperCase())}</div><div class="gr"><b>${esc(p)}</b><div class="mute">${o.cost!=null?"Cost "+fmt(o.cost):"No cost set"}</div></div><div class="rt"><b class="${o.q<=3?"neg":""}">${o.q} left</b><div class="mute">${fmt(o.q*(o.cost||0))}</div></div></div>`).join(""):`<div class="card mute">No stock yet. In Home, type “stock OG glass 50 cost 300”.</div>`)+(low.length?`<button class="p" style="width:100%;margin-top:10px" onclick="reorder()">Copy reorder list</button>`:"")}
function reorder(){copy("Reorder list\n"+Object.entries(db.stock).filter(x=>x[1].q<=3).map(x=>x[0]+" ("+x[1].q+" left)").join("\n"),"List copied")}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast("Voice isn’t supported in this browser");const m=new R();m.lang=db.vl||"en-IN";m.onresult=e=>{$("#msg").value=e.results[0][0].transcript;addMsg()};m.onerror=()=>toast("Couldn’t hear that");m.start();toast("Listening")}
function closeDay(){const t=today(),ts=db.sales.filter(s=>s.t>=t),q=Q[Math.floor(Date.now()/864e5)%Q.length],sm=(l,f)=>fmt(l.reduce((a,x)=>a+f(x),0));copy(`Closing summary, ${hijri()}\nSales: ${sm(ts,s=>s.a)}\nProfit: ${sm(ts,profit)}\nNew udhaar: ${sm(ts.filter(s=>s.st==="u"),s=>s.a)}\nReceived: ${sm(db.pays.filter(p=>p.t>=t),p=>p.a)}\n\n“${q[0]}” (${q[1]})`,"Summary copied")}
function hijri(){try{return new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}).format(new Date())}catch(e){return new Date().toLocaleDateString()}}
function topP(ss){const m={};ss.forEach(s=>{const k=s.p.toLowerCase();m[k]=(m[k]||0)+profit(s)});const l=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5);return l.length?l.map(x=>`<div class="row sp"><span>${esc(x[0])}</span><b class="pos">${fmt(x[1])}</b></div>`).join(""):"<span class='mute'>No sales yet this month.</span>"}
let hf="All",ip=null;const TOPICS=["All",...new Set(Q.map(q=>q[2]))];
function vHikmah(){const l=Q.filter(q=>hf==="All"||q[2]===hf);
 return`<h1>Hikmah</h1><div class="mute">${Q.length} reminders for an honest, halal business.</div><div class="chips">${TOPICS.map(t=>`<button class="${t===hf?"on":""}" onclick="hf='${t}';render()">${t}</button>`).join("")}</div>`+l.map(q=>`<div class="card moon">${q[3]?`<div class="ar">${q[3]}</div>`:""}<p class="q">“${esc(q[0])}”</p><div class="row sp"><b class="mute">${q[1]}</b><button onclick="copy('“'+Q[${Q.indexOf(q)}][0]+'” ('+Q[${Q.indexOf(q)}][1]+')','Quote copied')">Copy</button></div></div>`).join("")+`<div class="mute">Wording is paraphrased. Please check with a scholar before quoting publicly.</div>`}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;if(tab==="backup")render()});
function dl(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:"application/json"}));a.download="hisab-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();db.lastBackup=Date.now();save();render()}
function rfile(i){const f=i.files[0];if(f)f.text().then(t=>{$("#rs").value=t;rst()})}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
const T=[["chat","home","Home"],["ledger","book","Ledger"],["search","search","Find"],["reports","chart","Reports"],["hikmah","moon","Hikmah"]];
function go(t){tab=t;render();scrollTo(0,0)}
function render(){$("#nav").innerHTML=T.map(x=>`<button class="${tab===x[0]?"on":""}" onclick="go('${x[0]}')">${ic(x[1])}${x[2]}</button>`).join("");
 $("#bar").style.display=tab==="chat"?"block":"none";
 $("#v").innerHTML=({chat:vChat,ledger:vLedger,search:vSearch,reports:vReports,backup:vBackup,hikmah:vHikmah,stock:vStock})[tab]();
 const pr=[...new Set(db.sales.slice().reverse().map(s=>s.p))].slice(0,6),cu=names().slice(0,5);
 $("#chips").innerHTML=[...cu,...pr].map(x=>`<button onclick="$('#msg').value+=($('#msg').value?' ':'')+this.textContent;$('#msg').focus()">${esc(x)}</button>`).join("")}
$("#go").onclick=addMsg;$("#msg").addEventListener("keydown",e=>{if(e.key==="Enter")addMsg()});
render();
</script></body></html>
