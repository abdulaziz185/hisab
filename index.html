<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#181818"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Hisab AI</title>
<style>
:root{--bg:#181818;--card:#222;--card2:#2c2d30;--p:#ab9ff2;--p2:#ab9ff2;--t:#fff;--m:#777;--g:#21e56f;--r:#eb3742}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:auto;padding-top:env(safe-area-inset-top)}
header{padding:14px 18px;font-weight:700;font-size:20px;letter-spacing:.3px}header span{color:var(--p)}
main{flex:1;overflow-y:auto;padding:0 14px 12px}
.v{display:none}.v.on{display:block;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
#chat.on{display:flex;flex-direction:column;min-height:100%}
.b{max-width:85%;padding:10px 14px;border-radius:18px;margin:6px 0;line-height:1.35;white-space:pre-wrap;animation:f .2s}
.b.u{align-self:flex-end;background:var(--p);color:#181818;border-bottom-right-radius:5px}
.b.a{align-self:flex-start;background:var(--card2);border-bottom-left-radius:5px}
.chip{display:inline-block;margin:6px 6px 0 0;padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--card2);color:var(--p);font-size:14px}
.row{display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bg)}
input,select{background:var(--card);border:1px solid #2c2d30;color:var(--t);border-radius:16px;padding:13px 16px;font-size:16px;width:100%;outline:0}
input:focus{border-color:var(--p2)}
button{border:0;background:var(--p);color:#181818;border-radius:16px;padding:12px 18px;font-size:15px;font-weight:600}
button.s{background:var(--card2);color:var(--p)}button.d{background:#3a1519;color:var(--r)}nav a svg{display:block;margin:0 auto 3px}
nav{display:flex;background:var(--card);border-top:1px solid #2c2d30;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:11px 0;font-size:12px;color:var(--m)}nav a.on{color:var(--p)}nav a i{display:block;font-style:normal;font-size:19px}
.c{background:var(--card);border-radius:16px;padding:16px;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{color:var(--m);font-size:13px}.n{font-size:22px;font-weight:700;margin-top:2px}.big{background:linear-gradient(160deg,#2d2650,#222 70%)}
.li{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #2c2d30}
.pend{color:var(--r)}.ok{color:var(--g)}.sub{color:var(--m);font-size:13px}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}.tabs button{padding:8px 14px;font-size:13px;background:var(--card);color:var(--m)}.tabs button.on{background:var(--p);color:#181818}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}#modal.on{display:flex}
#modal>div{background:var(--card);width:100%;max-width:600px;margin:auto;border-radius:24px 24px 0 0;padding:18px;display:grid;gap:10px}
label{font-size:13px;color:var(--m)}
</style></head><body><div id="app">
<header>Hisab <span>AI</span></header>
<main>
<section id="chat" class="v on"><div id="msgs"></div></section>
<section id="home" class="v"></section>
<section id="sales" class="v"><input id="q" placeholder="Search sales…"><div class="tabs" id="ft"></div><div id="sl"></div></section>
<section id="cust" class="v"></section>
<section id="data" class="v"></section>
</main>
<form class="row" id="f"><input id="in" autocomplete="off" placeholder="e.g. OG glass Shahgee"><button>Send</button></form>
<nav><a data-v="chat" class="on"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg></i>Chat</a><a data-v="home"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></i>Home</a><a data-v="sales"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg></i>Sales</a><a data-v="cust"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></i>Udhaar</a><a data-v="data"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg></i>Backup</a></nav>
</div><div id="modal"></div>
<script src="app.js"></script></body></html>
