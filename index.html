function vProfile(){const c=prof;if(!c)return vLedger();const L=db.sales.filter(s=>sameC(s.c,c)),Pm=db.pays.filter(p=>sameC(p.c,c)),B=L.filter(s=>s.q>0).sort((a,b)=>a.t-b.t),m={};B.forEach(s=>m[s.p]=(m[s.p]||0)+s.q);const u=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5),last=B.length?B[B.length-1]:null,days=last?Math.floor((Date.now()-last.t)/864e5):0,b=bal(c),row=(k,v)=>`<div class="row sp" style="margin-top:6px"><span class="mute">${k}</span><b>${v}</b></div>`;
 return`<div class="row"><button class="ib" onclick="go('ledger')">‹</button><h1>${esc(c)}</h1></div><div class="card moon"><span class="mute">Pending udhaar</span><div class="big ${b>0?"neg":"pos"}">${fmt(b)}</div></div><div class="card">${row("Total bought",fmt(L.reduce((a,s)=>a+s.a,0)))}${row("Paid so far",fmt(Pm.reduce((a,p)=>a+p.a,0)))}${row("Average sale",fmt(B.length?B.reduce((a,s)=>a+s.a,0)/B.length:0))}${row("Last purchase",last?(days?days+" days ago":"today"):"none")}</div><h2>Usual items</h2><div class="chips">${u.map(x=>`<button onclick="again('${esc(c)}','${esc(x[0])}')">${esc(x[0])} (${x[1]})</button>`).join("")||"<span class='mute'>No items yet.</span>"}</div><h2>History</h2>`+[...L,...Pm].sort((a,b)=>b.t-a.t).slice(0,15).map(entryHTML).join("")+`<button style="margin-top:8px" onclick="statement()">Copy statement</button>`}
function ask(v){const t=v.toLowerCase(),n=new Date(),d0=today(),P=/yesterday|kal/.test(t)?[d0-864e5,d0,"yesterday"]:/today|aaj/.test(t)?[d0,1e15,"today"]:/week/.test(t)?[d0-6*864e5,1e15,"the last 7 days"]:/year/.test(t)?[+new Date(n.getFullYear(),0,1),1e15,"this year"]:/\ball\b|total|ever/.test(t)?[0,1e15,"all time"]:[+new Date(n.getFullYear(),n.getMonth(),1),1e15,"this month"];
 const S=db.sales.filter(s=>s.t>=P[0]&&s.t<P[1]),sm=(l,f)=>l.reduce((a,x)=>a+f(x),0),c=names().find(x=>t.includes(x.toLowerCase())),pk=[...new Set([...Object.keys(db.stock),...db.sales.map(s=>s.p.toLowerCase())])].find(k=>k!=="discount"&&t.includes(k));let a;
 if(c){const L=S.filter(s=>sameC(s.c,c)&&s.q>0&&s.p!=="Discount");a=`${c} owes ${fmt(bal(c))}. Bought ${fmt(sm(L,s=>s.a))} across ${L.length} sales (${P[2]}).`+(L.length?` Last item: ${L[L.length-1].p}.`:"")}
 else if(/owe|udhaar|pending|baqaya|baqi/.test(t)){const o=names().map(x=>[x,bal(x)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5);a=o.length?"Pending udhaar: "+o.map(x=>x[0]+" "+fmt(x[1])).join(", ")+".":"Nobody owes you anything."}
 else if(pk){const L=S.filter(s=>s.p.toLowerCase()===pk),k=db.stock[pk];a=`${pk} (${P[2]}): sold ${sm(L,s=>s.q)}, profit ${fmt(sm(L,profit))}.`+(k?` ${k.q} left in stock.`:"")}
 else if(/best|top|most|earn|zyada/.test(t)){const m={};S.forEach(s=>m[s.p.toLowerCase()]=(m[s.p.toLowerCase()]||0)+profit(s));const l=Object.entries(m).filter(x=>x[0]!=="discount").sort((a,b)=>b[1]-a[1]).slice(0,3);a=l.length?`Top by profit (${P[2]}): `+l.map(x=>x[0]+" "+fmt(x[1])).join(", ")+".":"No sales in that period yet."}
 else if(/stock|left|low/.test(t)){const l=Object.entries(db.stock).filter(x=>x[1].q<=3);a=l.length?"Running low: "+l.map(x=>x[0]+" ("+x[1].q+")").join(", ")+".":"Nothing is running low."}
 else if(/profit|nafa|sale|sold|sell|kamai|bika/.test(t))a=`${P[2]}: sales ${fmt(sm(S,s=>s.a))}, profit ${fmt(sm(S,profit))}, from ${S.filter(s=>s.q>0&&s.p!=="Discount").length} sales.`;
 else a="Try: “How much profit this month?”, “What does Shahgee owe?”, “Best selling item?”, “How many OG glass sold?”, “What is low in stock?”";
 ans=[v,a]}
function hijri(){try{return new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}).format(new Date())}catch(e){return new Date().toLocaleDateString()}}

let hf="All",ip=null;const TOPICS=["All",...new Set(Q.map(q=>q[2]))];

addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;if(tab==="backup")render()});

function rfile(i){const f=i.files[0];if(f)f.text().then(t=>{$("#rs").value=t;rst()})}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
const T=[["chat","home","Home"],["ledger","book","Ledger"],["search","search","Find"],["reports","chart","Reports"],["hikmah","moon","Hikmah"]];
function go(t){tab=t;render();scrollTo(0,0)}
function render(){$("#nav").innerHTML=T.map(x=>`<button class="${tab===x[0]?"on":""}" onclick="go('${x[0]}')">${ic(x[1])}${x[2]}</button>`).join("");
 $("#bar").style.display=tab==="chat"?"block":"none";document.body.style.paddingBottom=tab==="chat"?"290px":"110px";$("#qa").innerHTML=`<button class="p lg" style="flex:1" onclick="openSale('sale')">+ Sale</button><button class="lg" style="flex:1" onclick="openSale('pay')">Payment in</button><button class="lg sq" onclick="mic()">${ic("mic")}</button>`;
 $("#v").innerHTML=({chat:vChat,ledger:vLedger,search:vSearch,reports:vReports,backup:vBackup,hikmah:vHikmah,stock:vStock,profile:vProfile})[tab]();
 const pr=[...new Set(db.sales.slice().reverse().map(s=>s.p))].slice(0,6),cu=names().slice(0,5);
 $("#chips").innerHTML=[...cu,...pr].map(x=>`<button onclick="$('#msg').value+=($('#msg').value?' ':'')+this.textContent;$('#msg').focus()">${esc(x)}</button>`).join("");if(tab==="backup")snapUI()}
$("#go").onclick=addMsg;$("#msg").addEventListener("keydown",e=>{if(e.key==="Enter")addMsg()});
let qs=null,RC=[],RP=[];
const recentC=()=>{const m={};[...db.sales,...db.pays].forEach(e=>{if(e.c)m[e.c]=Math.max(m[e.c]||0,e.t)});return Object.keys(m).sort((a,b)=>m[b]-m[a])};
const recentP=()=>[...new Set(db.sales.slice().reverse().filter(s=>s.q>0&&s.p!=="Discount").map(s=>s.p))].slice(0,8);
function openSale(m){qs={m,c:"",p:"",q:1,n:"",st:"u",disc:"",cost:"",due:""};drawSheet()}
function closeSheet(){qs=null;const e=$("#sheet");if(e)e.remove()}
function pickC(c){qs.c=c;if(qs.p&&qs.m!=="pay"){const l=lastU(c,qs.p);if(l)qs.n=Math.round(l.u)}drawSheet()}
function pickP(p){qs.p=p;qs.cost=db.costs[p.toLowerCase()]||"";const l=lastU(qs.c,p);if(l)qs.n=Math.round(l.u);drawSheet()}
function upd(){const e=$("#sum");if(!e)return;const c=qs.c.trim(),n=+qs.n||0;if(qs.m==="pay"){e.innerHTML=c&&n?`${esc(c)} will owe <b>${fmt(Math.max(0,bal(c)-n))}</b>`:"";return}
 const t=qs.q*n-(+qs.disc||0);e.innerHTML=n?`Total <b>${fmt(t)}</b>${c&&qs.st==="u"?` · ${esc(c)} will owe <b>${fmt(bal(c)+t)}</b>`:""}`:""}
function drawSheet(){const pay=qs.m==="pay";RC=pay?recentC().filter(c=>bal(c)>0):recentC().slice(0,8);RP=recentP();
 let e=$("#sheet");if(!e){e=document.createElement("div");e.id="sheet";e.onclick=ev=>{if(ev.target===e)closeSheet()};document.body.appendChild(e)}
 const known=RC.some(x=>sameC(x,qs.c)),last=qs.c&&qs.p&&lastU(qs.c,qs.p);
 e.innerHTML=`<div class="sh"><div class="grab"></div><div class="seg"><button class="${pay?"":"on"}" onclick="qs.m='sale';drawSheet()">Sale</button><button class="${pay?"on":""}" onclick="qs.m='pay';drawSheet()">Payment in</button></div>
 <div class="lbl">Customer</div><div class="cc">${pay?"":`<button class="${qs.c?"":"on"}" onclick="pickC('')">Cash sale</button>`}${RC.map((c,i)=>`<button class="${qs.c&&sameC(qs.c,c)?"on":""}" onclick="pickC(RC[${i}])">${esc(c)}${pay?" · "+fmt(bal(c)):""}</button>`).join("")}</div>
 <input id="qc" placeholder="Or type a new name" value="${known?"":esc(qs.c)}" oninput="qs.c=this.value;upd()">`+(pay?
 `<div class="lbl">Amount received</div><input id="qn" type="number" inputmode="decimal" placeholder="Amount" value="${qs.n}" oninput="qs.n=this.value;upd()">${qs.c&&bal(qs.c)>0?`<button onclick="qs.n=Math.round(bal('${esc(qs.c)}'));drawSheet()">Full amount ${fmt(bal(qs.c))}</button>`:""}`:
 `<div class="lbl">Item</div><div class="cc">${RP.map((p,i)=>`<button class="${qs.p.toLowerCase()===p.toLowerCase()?"on":""}" onclick="pickP(RP[${i}])">${esc(p)}</button>`).join("")}</div>
 <input id="qp" placeholder="Or type an item" value="${RP.some(x=>x.toLowerCase()===qs.p.toLowerCase())?"":esc(qs.p)}" oninput="qs.p=this.value;upd()">
 <div class="row3"><div class="step"><button onclick="qs.q=Math.max(1,qs.q-1);drawSheet()">−</button><b>${qs.q}</b><button onclick="qs.q++;drawSheet()">+</button></div><input id="qn" type="number" inputmode="decimal" placeholder="Price each" value="${qs.n}" oninput="qs.n=this.value;upd()"></div>
 ${last?`<div class="mute">Last price ${fmt(last.u)} each</div>`:""}
 <div class="row3"><input type="number" inputmode="numeric" placeholder="Discount" value="${qs.disc}" oninput="qs.disc=this.value;upd()"><input type="number" inputmode="decimal" placeholder="Your cost each" value="${qs.cost}" oninput="qs.cost=this.value"></div>
 <div class="seg"><button class="${qs.st==="u"?"on":""}" onclick="qs.st='u';drawSheet()">Udhaar</button><button class="${qs.st==="u"?"":"on"}" onclick="qs.st='p';drawSheet()">Paid</button></div>${qs.st==="u"?`<div class="lbl">Promised to pay by (optional)</div><input type="date" value="${qs.due}" onchange="qs.due=this.value">`:""}`)+
 `<div class="sum" id="sum"></div><button class="p lg" onclick="sheetSave()">${pay?"Save payment":"Save sale"}</button></div>`;upd()}
function sheetSave(){let c=qs.c.trim();if(c)c=match(c);const n=+qs.n;
 if(qs.m==="pay"){if(!c||!n)return toast("Pick a customer and amount");db.pays.push({id:uid(),t:Date.now(),c,a:n});save();closeSheet();toast("Payment saved");return render()}
 if(!qs.p.trim()||!n)return toast("Pick an item and price");pend={c,p:qs.p.trim(),q:qs.q,n,each:true,cost:+qs.cost>0?+qs.cost:null,st:c&&qs.st==="u"?"u":"p",disc:+qs.disc||0};if(c&&qs.st==="u"&&qs.due)db.due[c]=+new Date(qs.due+"T12:00");closeSheet();savePend();if(navigator.vibrate)navigator.vibrate(20)}
let MC=[],DUE=[];
function streak(){const ds=new Set(db.sales.map(x=>new Date(x.t).toDateString()));let n=0,d=new Date();if(!ds.has(d.toDateString()))d.setDate(d.getDate()-1);while(ds.has(d.toDateString())){n++;d.setDate(d.getDate()-1)}return n}
function setGoal(){const v=prompt("Daily sales goal (Rs)",db.goal||"");if(v===null)return;db.goal=Math.max(0,+v||0);save();render()}
function motiv(){const t=today(),sl=db.sales.filter(x=>x.t>=t&&x.q>0).reduce((a,x)=>a+x.a,0),g=db.goal||0,pc=g?Math.min(100,sl/g*100):0,sk=streak(),rec=db.pays.filter(x=>x.t>=t).reduce((a,x)=>a+x.a,0);
 const prev=[1,2,3,4,5,6].map(i=>{const a=t-i*864e5;return db.sales.filter(x=>x.t>=a&&x.t<a+864e5&&x.q>0).reduce((y,x)=>y+x.a,0)}),best=sl>0&&prev.some(v=>v>0)&&sl>=Math.max(...prev);
 const msg=!g?"Set a daily goal":pc>=100?"Goal reached. Alhamdulillah!":pc>=50?"Over halfway. Keep going":sl?"Good start. "+fmt(g-sl)+" to go":"New day. Bismillah, make the first sale";
 return`<div class="card moon" onclick="setGoal()"><div class="row" style="gap:14px;align-items:center"><svg viewBox="0 0 44 44" width="84" height="84"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="22" cy="22" r="18" fill="none" stroke="var(--acc)" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="${pc} 100" transform="rotate(-90 22 22)"/><text x="22" y="26" text-anchor="middle" fill="var(--ink)" font-size="10" font-weight="800">${Math.round(pc)}%</text></svg><div class="gr"><b>${msg}</b><div class="mute">${g?fmt(sl)+" of "+fmt(g)+" today":"Tap here to set your goal"}</div><div class="mute">🔥 ${sk} day streak${rec?" · "+fmt(rec)+" recovered":""}${best?" · Best day this week":""}</div></div></div></div>`}
function overdue(){const n=Date.now();return names().filter(c=>bal(c)>0).map(c=>{const due=db.due[c],lp=Math.max(0,...db.pays.filter(x=>sameC(x.c,c)).map(x=>x.t)),fu=Math.min(...db.sales.filter(x=>x.st==="u"&&sameC(x.c,c)).map(x=>x.t)),days=Math.floor((n-(lp||fu))/864e5);return{c,b:bal(c),due,late:due?due<n:days>30,days}}).filter(x=>x.late).sort((a,b)=>b.b-a.b)}
function recoverCard(){DUE=overdue().slice(0,3);if(!DUE.length)return"";return`<div class="card"><b>Recover today</b>${DUE.map((x,i)=>`<div class="row sp" style="margin:8px 0;gap:8px"><div class="gr"><b>${esc(x.c)}</b> ${fmt(x.b)}<div class="mute">${x.due?"promised "+new Date(x.due).toLocaleDateString():x.days+" days since last payment"}</div></div><button onclick="remind(${i})">Remind</button><button onclick="settle(${i})">Settled</button></div>`).join("")}</div>`}

function costFix(){MC=[...new Set(db.sales.filter(x=>x.q>0&&x.p!=="Discount"&&unitCost(x)==null).map(x=>x.p.toLowerCase()))].slice(0,10);return`<h2>Add missing costs</h2><div class="card">${MC.length?MC.map((k,i)=>`<div class="row sp" style="margin:6px 0;gap:10px"><span>${esc(k)}</span><input type="number" inputmode="decimal" placeholder="Cost each" style="width:120px" onchange="setCost(${i},this.value)"></div>`).join(""):'<div class="mute">Every item has a cost, so profit is exact.</div>'}</div>`}

render();
