 return`<div style="text-align:center;margin:18px 0 4px" onclick="RNG=(RNG+1)%3;render()"><div class="mute">${RNGS[RNG]} sales · tap to change</div><div class="hbig" data-v="${sale}">${fmt(sale)}</div>${spark()}${hideP()?"":`<span class="pill2 ${pf<0?"neg":""}">${pf<0?"−":"+"}${fmt(Math.abs(pf))} profit</span>`}<div class="mute" style="margin-top:8px">Udhaar pending ${fmt(owed)}</div></div>`}
const act=(i,l,f)=>`<button class="act" onclick="${f}"><span class="cir">${i}</span><span>${l}</span></button>`;
function aiRow(){return aiOn()?`<div class="hs">${TOOLS.slice(0,9).map((t,i)=>`<button onclick="tool(${i})">✨ ${t[0]}</button>`).join("")}<button onclick="go('backup')">More…</button></div>`:""}
function custList(){CH=names().filter(c=>bal(c)>0).sort((a,b)=>bal(b)-bal(a)).slice(0,5);if(!CH.length)return"";return`<div class="row sp"><b>Customers</b><span class="mute" onclick="go('ledger')">See all</span></div>`+CH.map((c,i)=>{const dd=db.due[c],late=dd&&dd<Date.now();return`<div class="tk" onclick="openCust(CH[${i}])">${av(c)}<div class="gr"><b>${esc(c)}</b><div class="mute">owes you</div></div><div class="rt"><b>${fmt(bal(c))}</b><div class="${late?"neg":"mute"}">${dd?(late?"overdue":"due "+new Date(dd).toLocaleDateString(undefined,{day:"numeric",month:"short"})):""}</div></div></div>`}).join("")}
function activity(){const L=[...db.sales,...db.pays].sort((a,b)=>b.t-a.t).slice(0,8);if(!L.length)return`<div class="card mute">No entries yet. Tap Sell, or type below.</div>`;return`<div class="row sp" style="margin-top:8px"><b>Activity</b><span class="mute" onclick="go('all')">See all</span></div>`+L.map(e=>{const pay=e.p===undefined,ret=!pay&&e.q<0,dis=e.p==="Discount",i=pay?"↙":ret?"↩":dis?"％":"↗",t=pay?"Payment":dis?"Discount":(ret?"Return ":"")+Math.abs(e.q)+" × "+esc(e.p);return`<div class="tk" onclick="editSheet(${e.id})"><div class="av ${pay||ret||dis?"gn":""}">${i}</div><div class="gr"><b>${t}</b><div class="mute">${esc(e.c||"Cash")} · ${new Date(e.t).toLocaleDateString(undefined,{day:"numeric",month:"short"})}${e.st==="u"?" · udhaar":""}</div></div><div class="rt"><b class="${pay||e.a<0?"pos":""}">${pay?"+":""}${fmt(e.a)}</b></div></div>`}).join("")}
function vChat(){const h=new Date().getHours();return`<div class="row sp" style="margin-top:4px"><div class="row" style="gap:10px;align-items:center"><div class="av" style="background:var(--acc);color:var(--onacc)">H</div><div><b>Hisab AI</b><div class="mute">${h<12?"Good morning":h<17?"Good afternoon":"Good evening"}</div></div></div><div class="row" style="gap:6px"><button class="ib" onclick="go('search')">🔍</button><button class="ib" onclick="go('backup')">⚙</button></div></div>${hero()}<div class="acts">${act("＋","Sell","openSale('sale')")}${act("↓","Got paid","openSale('pay')")}${act("▦","Stock","go('stock')")}${act("📷","Scan","openScan()")}</div>${aiRow()}${motiv()}${recoverCard()}${custList()}${activity()}<div class="hs" style="margin-top:10px"><button onclick="closeDay()">Close day</button><button onclick="go('reports')">Reports</button><button onclick="go('hikmah')">Hikmah</button></div>`}
const gv=(k,d)=>localStorage.getItem(k)||d,hideP=()=>localStorage.getItem("hisab-hp")==="1";
function applyTheme(){const r=document.documentElement,t=gv("hisab-t","auto");t==="auto"?r.removeAttribute("data-t"):r.setAttribute("data-t",t);r.setAttribute("data-a",gv("hisab-a","blue"))}
function togTheme(){const T=["auto","light","dark"];localStorage.setItem("hisab-t",T[(T.indexOf(gv("hisab-t","auto"))+1)%3]);applyTheme();render()}
function togAcc(){const A=["blue","green","purple","orange"];localStorage.setItem("hisab-a",A[(A.indexOf(gv("hisab-a","blue"))+1)%4]);applyTheme();render()}
function togHP(){if(hideP()){if(localStorage.getItem(PK)&&String(hp(prompt("Enter your PIN to show profit")||""))!==localStorage.getItem(PK))return toast("Wrong PIN");localStorage.removeItem("hisab-hp")}else localStorage.setItem("hisab-hp","1");render()}
applyTheme();
document.addEventListener("click",e=>{if(navigator.vibrate&&e.target.closest&&e.target.closest("button"))navigator.vibrate(8)});
let sT=0;function dsq(){clearTimeout(sT);sT=setTimeout(doSearch,150)}
function countUp(){const e=$(".hbig");if(!e||matchMedia("(prefers-reduced-motion: reduce)").matches)return;const v=+e.dataset.v||0,t0=performance.now(),f=n=>{const k=Math.min(1,(n-t0)/500);e.textContent=fmt(Math.round(v*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function spark(){const t=today(),D=864e5,v=[6,5,4,3,2,1,0].map(i=>db.sales.filter(x=>x.t>=t-i*D&&x.t<t-i*D+D&&x.q>0).reduce((a,x)=>a+x.a,0)),m=Math.max(...v,1);return`<svg viewBox="0 0 140 36" width="140" height="36" style="margin:6px 0">${v.map((x,i)=>{const h=Math.max(2,x/m*32);return`<rect x="${i*20+3}" y="${34-h}" width="14" height="${h}" rx="4" fill="var(--acc)" opacity="${i===6?1:.45}"/>`}).join("")}</svg>`}
function cartAdd(){const n=+qs.n;if(!qs.p.trim()||!n)return toast("Pick an item and price");qs.cart.push({p:qs.p.trim(),q:qs.q,n,d:+qs.disc||0,cost:+qs.cost>0?+qs.cost:null});qs.p="";qs.q=1;qs.n="";qs.disc="";qs.cost="";drawSheet()}
function cartHTML(){const L=qs.cart||[];return L.length?`<div class="card"><b>On this bill</b>${L.map((x,i)=>`<div class="row sp" style="margin:6px 0"><span>${x.q} × ${esc(x.p)}</span><span><b>${fmt(x.q*x.n-x.d)}</b> <button onclick="qs.cart.splice(${i},1);drawSheet()">✕</button></span></div>`).join("")}</div>`:""}
function repeatLast(){const c=prof,L=db.sales.filter(x=>sameC(x.c,c)&&x.q>0&&x.p!=="Discount");if(!L.length)return toast("No earlier sale");const d=new Date(Math.max(...L.map(x=>x.t))).toDateString(),it=L.filter(x=>new Date(x.t).toDateString()===d);openSale("sale");qs.c=c;qs.cart=it.map(x=>({p:x.p,q:x.q,n:Math.round(x.a/x.q),d:0,cost:null}));drawSheet()}
function stmt(){const c=prof,E=[...db.sales.filter(x=>sameC(x.c,c)),...db.pays.filter(x=>sameC(x.c,c))].sort((a,b)=>a.t-b.t);let run=0;const rows=E.map(x=>{const pay=x.p===undefined;run+=pay?-x.a:(x.st==="u"?x.a:0);return`<tr><td>${new Date(x.t).toLocaleDateString()}</td><td>${pay?"Payment":esc(x.p)+(x.q!==1?" × "+x.q:"")}</td><td>${pay?"":fmt(x.a)}</td><td>${pay?fmt(x.a):""}</td><td>${fmt(run)}</td></tr>`}).join("");
 const w=open("","_blank");if(!w)return toast("Allow pop-ups to make the PDF",3500);w.document.write(`<html><head><meta charset="utf-8"><title>${esc(c)} statement</title><style>body{font-family:-apple-system,Segoe UI,sans-serif;padding:24px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;font-size:14px;text-align:left}</style></head><body><h2>Statement: ${esc(c)}</h2><p>Balance: <b>${fmt(bal(c))}</b> · ${new Date().toLocaleDateString()}</p><table><tr><th>Date</th><th>Item</th><th>Bill</th><th>Paid</th><th>Balance</th></tr>${rows}</table><p style="color:#666;margin-top:24px">Choose Print, then Save as PDF.</p></body></html>`);w.document.close();setTimeout(()=>w.print(),400)}
async function pickContact(){if(!(navigator.contacts&&navigator.contacts.select))return toast("This browser can’t open contacts. Type the number.",3500);try{const r=await navigator.contacts.select(["tel"],{multiple:false}),t=r[0]&&r[0].tel&&r[0].tel[0];if(t){const i=db.cinfo[prof]||{ph:"",lim:0,note:""};i.ph=t.replace(/[^\d+]/g,"");db.cinfo[prof]=i;save();render()}}catch(e){}}
function speak(){if(!window.speechSynthesis)return toast("Reading aloud isn’t supported here");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(AIR.say);u.lang=db.vl||"en-IN";speechSynthesis.speak(u)}
let ED=null;
function editSheet(id){const e=db.sales.find(x=>x.id===id)||db.pays.find(x=>x.id===id);if(!e)return;const pay=e.p===undefined;ED={id,pay,c:e.c||"",p:pay?"":e.p,q:pay?1:Math.abs(e.q),qs:e.q<0?-1:1,a:Math.round(Math.abs(e.a)*100)/100,as:e.a<0?-1:1,st:e.st==="u"?"u":"p",d:new Date(e.t).toLocaleDateString("en-CA"),cost:e.cost!=null?e.cost:"",all:false};edDraw()}
function edDraw(){const x=ED,pay=x.pay;mkSheet().innerHTML=`<div class="sh"><div class="grab"></div><h2 style="margin:0">${pay?"Edit payment":"Edit entry"}</h2><div class="lbl">Customer ${pay?"":"(empty means cash sale)"}</div><input list="edn" value="${esc(x.c)}" oninput="ED.c=this.value"><datalist id="edn">${names().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>`+(pay?"":`<div class="lbl">Item</div><input value="${esc(x.p)}" oninput="ED.p=this.value"><div class="row3"><div><div class="lbl">Quantity${x.qs<0?" returned":""}</div><input type="number" inputmode="decimal" value="${x.q}" oninput="ED.q=+this.value"></div><div><div class="lbl">Cost each</div><input type="number" inputmode="decimal" value="${x.cost}" oninput="ED.cost=this.value"></div></div>`)+`<div class="lbl">${pay?"Amount":"Total"} (Rs)</div><input type="number" inputmode="decimal" value="${x.a}" oninput="ED.a=+this.value">`+(pay?"":`<div class="seg"><button class="${x.st==="u"?"on":""}" onclick="ED.st='u';edDraw()">Udhaar</button><button class="${x.st==="u"?"":"on"}" onclick="ED.st='p';edDraw()">Paid</button></div><label class="row" style="gap:10px"><input type="checkbox" ${x.all?"checked":""} onchange="ED.all=this.checked"> Rename this item everywhere</label>`)+`<div class="lbl">Date</div><input type="date" value="${x.d}" onchange="ED.d=this.value"><button class="p lg" onclick="edSave()">Save changes</button><button class="lg" style="color:var(--bad)" onclick="edDel()">Delete entry</button></div>`}
function renameItem(ok,n2){const nk=n2.toLowerCase();db.sales.forEach(s=>{if(s.p.toLowerCase()===ok)s.p=n2});["stock","costs","sell"].forEach(m=>{const o=db[m];if(o[ok]!==undefined){if(o[nk]===undefined)o[nk]=o[ok];else if(m==="stock")o[nk].q+=o[ok].q;delete o[ok]}});Object.keys(db.bc).forEach(k=>{if(db.bc[k]===ok)db.bc[k]=nk})}
function edSave(){const x=ED,e=db.sales.find(y=>y.id===x.id)||db.pays.find(y=>y.id===x.id);if(!e)return closeSheet();let c=x.c.trim();if(c)c=match(c);if(!(x.a>0))return toast("Enter an amount");const nd=new Date(x.d+"T00:00");if(isNaN(nd))return toast("Pick a valid date");const o=new Date(e.t);nd.setHours(o.getHours(),o.getMinutes(),o.getSeconds());
 if(x.pay){if(!c)return toast("A payment needs a customer");e.c=c;e.a=x.a;e.t=+nd}
 else{const p=x.p.trim();if(!p)return toast("Enter an item");if(!(x.q>0))return toast("Enter a quantity");const ok=e.p.toLowerCase(),s0=db.stock[ok];if(s0)s0.q+=e.q;if(x.all&&p.toLowerCase()!==ok)renameItem(ok,p);
  e.p=p;e.c=c;e.q=x.qs*x.q;e.a=x.as*x.a;e.st=c&&x.st==="u"?"u":"p";e.t=+nd;e.cost=+x.cost>0?+x.cost:null;const nk=p.toLowerCase(),sk=db.stock[nk];if(sk)sk.q=Math.max(0,sk.q-e.q);if(+x.cost>0)db.costs[nk]=+x.cost}
 save();closeSheet();render();toast("Saved")}
function edDel(){const id=ED.id;closeSheet();del(id)}
function renameCust(){const c=prof,v=prompt("Rename "+c+" to",c);if(v===null)return;const n=v.trim();if(!n||n===c)return;const t=n[0].toUpperCase()+n.slice(1).toLowerCase(),ex=names().find(x=>sameC(x,t)&&!sameC(x,c));if(ex&&!confirm(t+" already exists. Merge "+c+" into "+t+"?"))return;db.sales.forEach(s=>{if(sameC(s.c,c))s.c=t});db.pays.forEach(s=>{if(sameC(s.c,c))s.c=t});if(db.due[c]!==undefined){if(db.due[t]===undefined)db.due[t]=db.due[c];delete db.due[c]}if(db.cinfo[c]){if(!db.cinfo[t])db.cinfo[t]=db.cinfo[c];delete db.cinfo[c]}prof=t;save();render();toast("Renamed")}
function vAll(){const L=[...db.sales,...db.pays].sort((a,b)=>b.t-a.t).slice(0,200);return`<div class="row"><button class="ib" onclick="go('chat')">‹</button><h1>All entries</h1></div><div class="mute" style="margin-bottom:8px">Tap any row to edit or delete it.</div>`+(L.map(entryHTML).join("")||`<div class="card mute">Nothing yet.</div>`)}
render();
</script></body></html>
